<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101214">
<link rel="manifest" href="manifest.json">
<title>Mein Gehalt</title>
<style>
:root{
  --bg:#101214;--surface:#181b1f;--surface2:#20242a;--border:#2d3239;
  --text:#f5f6f7;--muted:#9ba1aa;--accent:#7f8cff;--accent2:#a7b0ff;
  --danger:#d96b76;--shadow:0 12px 30px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{border:0;color:inherit;cursor:pointer}
.app{width:min(760px,100%);margin:auto;padding:22px 18px 42px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:24px;margin:0;font-weight:750;letter-spacing:-.5px}
.icon-btn,.plus-btn{width:44px;height:44px;border-radius:15px;background:var(--surface);border:1px solid var(--border);font-size:21px;box-shadow:var(--shadow)}
.plus-btn{background:var(--accent);font-size:27px}
.balance-card{margin-top:18px;padding:24px;border-radius:25px;background:linear-gradient(145deg,var(--surface),var(--surface2));border:1px solid var(--border);box-shadow:var(--shadow)}
.label{font-size:13px;color:var(--muted);margin-bottom:7px}
.balance{font-size:42px;font-weight:800;letter-spacing:-1.7px}
.balance.negative{color:var(--danger)}
.month-row{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding:5px 2px}
.month-name{font-size:18px;font-weight:700;text-transform:capitalize}
.nav-btn{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:24px}
.month-center{display:flex;align-items:center;gap:12px}
.salary-line{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:17px}
.salary-value{font-weight:700}
.small-btn{background:transparent;color:var(--accent2);font-weight:650;padding:6px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:27px 3px 12px}
.section-title{font-size:19px;font-weight:750}
.total{font-size:13px;color:var(--muted)}
.expenses{display:flex;flex-direction:column;gap:10px}
.expense{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);background:var(--surface);border-radius:19px}
.emoji{width:44px;height:44px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:23px;flex:none}
.exp-info{min-width:0;flex:1}
.exp-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-meta{font-size:12px;color:var(--muted);margin-top:3px}
.exp-price{font-weight:750;white-space:nowrap}
.exp-actions{display:flex;gap:5px}
.action{width:32px;height:32px;border-radius:10px;background:var(--surface2);font-size:15px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;border:1px dashed var(--border);border-radius:18px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:end;justify-content:center;padding:0;z-index:20}
.overlay.show{display:flex}
.modal{width:min(600px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:27px 27px 0 0;padding:20px 18px 28px;box-shadow:0 -15px 50px rgba(0,0,0,.35)}
.modal h2{font-size:21px;margin:0 0 18px}
.form-row{margin-bottom:13px}
.form-row label{display:block;color:var(--muted);font-size:13px;margin:0 0 6px}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:13px 14px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.primary,.secondary,.danger-btn{flex:1;padding:13px;border-radius:14px;font-weight:700}
.primary{background:var(--accent);color:white}.secondary{background:var(--surface2)}.danger-btn{background:rgba(217,107,118,.14);color:#ff9aa5}
.check{display:flex;align-items:center;gap:10px;color:var(--text);font-size:14px;margin-top:10px}
.check input{width:18px;height:18px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.emoji-choice{height:42px;border-radius:11px;background:var(--surface2);font-size:21px;border:1px solid transparent}
.emoji-choice.selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface2))}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme{padding:13px;border-radius:16px;background:var(--surface2);border:1px solid var(--border);text-align:left}
.theme.selected{border-color:var(--accent)}
.swatch{height:32px;border-radius:10px;margin-bottom:9px}
.theme-name{font-weight:700}.theme-desc{font-size:12px;color:var(--muted);margin-top:3px}
@media(max-width:420px){.balance{font-size:36px}.emoji-grid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Mein Gehalt</h1>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="themeBtn" aria-label="Design">🎨</button>
      <button class="plus-btn" id="addBtn" aria-label="Ausgabe hinzufügen">＋</button>
    </div>
  </div>

  <div class="balance-card">
    <div class="label">Verfügbar diesen Monat</div>
    <div id="balance" class="balance">0,00 €</div>
  </div>

  <div class="month-row">
    <button class="nav-btn" id="prevMonth">‹</button>
    <div class="month-center"><div id="monthName" class="month-name"></div></div>
    <button class="nav-btn" id="nextMonth">›</button>
  </div>

  <div class="salary-line">
    <div><div class="label">Monatsgehalt</div><div id="salary" class="salary-value">0,00 €</div></div>
    <button class="small-btn" id="salaryBtn">ändern</button>
  </div>

  <div class="section-head">
    <div class="section-title">Ausgaben</div>
    <div id="total" class="total">0,00 €</div>
  </div>
  <div id="expenses" class="expenses"></div>
</div>

<div class="overlay" id="expenseOverlay">
  <div class="modal">
    <h2 id="expenseTitle">Ausgabe hinzufügen</h2>
    <div class="form-row">
      <label>Bezeichnung</label>
      <input id="expenseName" placeholder="z. B. Essen">
    </div>
    <div class="form-row">
      <label>Betrag in €</label>
      <input id="expenseAmount" type="number" min="0" step="0.01" placeholder="30">
    </div>
    <div class="form-row">
      <label>Kategorie</label>
      <select id="expenseCategory">
        <option>Essen</option><option>Kleidung</option><option>Wohnen</option><option>Freizeit</option>
        <option>Transport</option><option>Handy</option><option>Shopping</option><option>Sparen</option>
        <option>Sonstiges</option>
      </select>
    </div>
    <div class="form-row">
      <label>Symbol auswählen</label>
      <div id="emojiGrid" class="emoji-grid"></div>
    </div>
    <label class="check"><input id="recurring" type="checkbox"> Jeden Monat automatisch übernehmen</label>
    <div class="modal-actions">
      <button class="secondary" id="cancelExpense">Abbrechen</button>
      <button class="primary" id="saveExpense">Speichern</button>
    </div>
  </div>
</div>

<div class="overlay" id="salaryOverlay">
  <div class="modal">
    <h2>Monatsgehalt ändern</h2>
    <div class="form-row">
      <label>Gehalt in €</label>
      <input id="salaryInput" type="number" min="0" step="0.01" placeholder="1100">
    </div>
    <div class="modal-actions">
      <button class="secondary" id="cancelSalary">Abbrechen</button>
      <button class="primary" id="saveSalary">Speichern</button>
    </div>
  </div>
</div>

<div class="overlay" id="themeOverlay">
  <div class="modal">
    <h2>Design auswählen</h2>
    <div id="themeGrid" class="theme-grid"></div>
    <div class="modal-actions"><button class="secondary" id="closeTheme">Schließen</button></div>
  </div>
</div>

<script>
const THEMES = {
  midnight:{name:"Midnight",desc:"Klassisch & ruhig",bg:"#101214",surface:"#181b1f",surface2:"#20242a",border:"#2d3239",text:"#f5f6f7",muted:"#9ba1aa",accent:"#7f8cff",accent2:"#a7b0ff"},
  forest:{name:"Deep Forest",desc:"Dunkel & natürlich",bg:"#0d1411",surface:"#14201a",surface2:"#1b2b23",border:"#294036",text:"#edf6f0",muted:"#92a79a",accent:"#4e9b70",accent2:"#7bc49a"},
  ocean:{name:"Deep Ocean",desc:"Kühl & modern",bg:"#0b1218",surface:"#121f29",surface2:"#1b2c38",border:"#29404f",text:"#eef7fb",muted:"#8fa7b4",accent:"#4f91b8",accent2:"#76b7d8"},
  plum:{name:"Dark Plum",desc:"Elegant & weich",bg:"#140e16",surface:"#211521",surface2:"#2d1c2e",border:"#463047",text:"#f8eef8",muted:"#ae96ad",accent:"#9a5f9f",accent2:"#c084c5"},
  amber:{name:"Dark Amber",desc:"Warm & edel",bg:"#15120c",surface:"#211b11",surface2:"#2d2415",border:"#483a20",text:"#faf5e8",muted:"#b2a47e",accent:"#b88a3d",accent2:"#d8ad60"},
  rose:{name:"Dark Rose",desc:"Dunkel & modern",bg:"#160d11",surface:"#231419",surface2:"#302027",border:"#4b2c37",text:"#f9eef1",muted:"#b29aa2",accent:"#ad5d75",accent2:"#d4859b"}
};
const EMOJIS=["🍔","🛒","👕","🏠","📱","🎮","🎬","💰","🚗","🚌","⛽","🎁","☕","🍕","✈️","💻","📚","🎵","⚽","🐶","🐱","💳","🏋️","🧾","🎨","🎧","🍿","🏖️","💡","📦","🛍️","🪙"];

let data = JSON.parse(localStorage.getItem("gehaltsAppV2") || "null") || {
  defaultSalary:1100, theme:"midnight", months:{}
};
let current = new Date();
current.setDate(1);
let editingId = null;
let selectedEmoji = "💳";

function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function money(n){return Number(n||0).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"}
function save(){localStorage.setItem("gehaltsAppV2",JSON.stringify(data))}
function getMonth(d=current){
  const k=key(d);
  if(!data.months[k]) data.months[k]={salary:Number(data.defaultSalary||0),expenses:[]};
  return data.months[k];
}
function monthLabel(d){return d.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}
function previousMonth(d){const x=new Date(d);x.setMonth(x.getMonth()-1);return x}
function carryRecurring(){
  const k=key(current);
  const m=getMonth(current);
  if(m.recurringAdded) return;
  const prev=getMonth(previousMonth(current));
  const recurring=(prev.expenses||[]).filter(e=>e.recurring);
  recurring.forEach(e=>{
    m.expenses.push({...e,id:crypto.randomUUID(),copiedFrom: e.id});
  });
  m.recurringAdded=true;
  save();
}
function render(){
  carryRecurring();
  const m=getMonth();
  const total=m.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const balance=Number(m.salary||0)-total;
  document.getElementById("monthName").textContent=monthLabel(current);
  document.getElementById("salary").textContent=money(m.salary);
  document.getElementById("balance").textContent=money(balance);
  document.getElementById("balance").classList.toggle("negative",balance<0);
  document.getElementById("total").textContent=money(total);
  const box=document.getElementById("expenses");
  box.innerHTML="";
  if(!m.expenses.length){
    box.innerHTML='<div class="empty">Noch keine Ausgaben in diesem Monat.<br>Tippe oben auf ＋, um eine hinzuzufügen.</div>';
    return;
  }
  m.expenses.forEach(e=>{
    const el=document.createElement("div");
    el.className="expense";
    el.innerHTML=`
      <div class="emoji">${e.emoji||"💳"}</div>
      <div class="exp-info">
        <div class="exp-name">${escapeHtml(e.name)}</div>
        <div class="exp-meta">${escapeHtml(e.category||"Sonstiges")}${e.recurring?' · 🔄 monatlich':''}</div>
      </div>
      <div class="exp-price">− ${money(e.amount)}</div>
      <div class="exp-actions">
        <button class="action edit">✏️</button>
        <button class="action delete">🗑️</button>
      </div>`;
    el.querySelector(".edit").onclick=()=>openExpense(e.id);
    el.querySelector(".delete").onclick=()=>{
      if(confirm("Diese Ausgabe löschen?")){
        m.expenses=m.expenses.filter(x=>x.id!==e.id);save();render();
      }
    };
    box.appendChild(el);
  });
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function openOverlay(id){document.getElementById(id).classList.add("show")}
function closeOverlay(id){document.getElementById(id).classList.remove("show")}
function buildEmojiGrid(){
  const grid=document.getElementById("emojiGrid");grid.innerHTML="";
  EMOJIS.forEach(e=>{
    const b=document.createElement("button");b.className="emoji-choice"+(e===selectedEmoji?" selected":"");b.textContent=e;
    b.onclick=()=>{selectedEmoji=e;buildEmojiGrid()};grid.appendChild(b);
  });
}
function openExpense(id=null){
  editingId=id;
  const m=getMonth();
  const e=id?m.expenses.find(x=>x.id===id):null;
  document.getElementById("expenseTitle").textContent=id?"Ausgabe bearbeiten":"Ausgabe hinzufügen";
  document.getElementById("expenseName").value=e?.name||"";
  document.getElementById("expenseAmount").value=e?.amount??"";
  document.getElementById("expenseCategory").value=e?.category||"Sonstiges";
  selectedEmoji=e?.emoji||"💳";
  document.getElementById("recurring").checked=!!e?.recurring;
  buildEmojiGrid();openOverlay("expenseOverlay");
  setTimeout(()=>document.getElementById("expenseName").focus(),80);
}
document.getElementById("addBtn").onclick=()=>openExpense();
document.getElementById("cancelExpense").onclick=()=>closeOverlay("expenseOverlay");
document.getElementById("saveExpense").onclick=()=>{
  const name=document.getElementById("expenseName").value.trim();
  const amount=Number(document.getElementById("expenseAmount").value);
  if(!name||!Number.isFinite(amount)||amount<0){alert("Bitte Bezeichnung und einen gültigen Betrag eingeben.");return}
  const m=getMonth();
  const item={name,amount,category:document.getElementById("expenseCategory").value,emoji:selectedEmoji,recurring:document.getElementById("recurring").checked};
  if(editingId){
    const i=m.expenses.findIndex(x=>x.id===editingId);
    if(i>=0)m.expenses[i]={...m.expenses[i],...item};
  }else m.expenses.push({...item,id:crypto.randomUUID()});
  save();closeOverlay("expenseOverlay");render();
};
document.getElementById("salaryBtn").onclick=()=>{
  document.getElementById("salaryInput").value=getMonth().salary||"";
  openOverlay("salaryOverlay");setTimeout(()=>document.getElementById("salaryInput").focus(),80);
};
document.getElementById("cancelSalary").onclick=()=>closeOverlay("salaryOverlay");
document.getElementById("saveSalary").onclick=()=>{
  const n=Number(document.getElementById("salaryInput").value);
  if(!Number.isFinite(n)||n<0){alert("Bitte ein gültiges Gehalt eingeben.");return}
  getMonth().salary=n;data.defaultSalary=n;save();closeOverlay("salaryOverlay");render();
};
document.getElementById("prevMonth").onclick=()=>{current=previousMonth(current);render()};
document.getElementById("nextMonth").onclick=()=>{const x=new Date(current);x.setMonth(x.getMonth()+1);current=x;render()};
document.getElementById("themeBtn").onclick=()=>{
  const grid=document.getElementById("themeGrid");grid.innerHTML="";
  Object.entries(THEMES).forEach(([id,t])=>{
    const b=document.createElement("button");b.className="theme"+(data.theme===id?" selected":"");
    b.innerHTML=`<div class="swatch" style="background:linear-gradient(135deg,${t.bg},${t.accent})"></div><div class="theme-name">${t.name}</div><div class="theme-desc">${t.desc}</div>`;
    b.onclick=()=>{data.theme=id;save();applyTheme();closeOverlay("themeOverlay")};
    grid.appendChild(b);
  });
  openOverlay("themeOverlay");
};
document.getElementById("closeTheme").onclick=()=>closeOverlay("themeOverlay");
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.classList.remove("show")}));
function applyTheme(){
  const t=THEMES[data.theme]||THEMES.midnight;
  const r=document.documentElement.style;
  for(const [k,v] of Object.entries(t))if(k!=="name"&&k!=="desc")r.setProperty("--"+k,v);
}
applyTheme();render();
</script>
</body>
</html>
